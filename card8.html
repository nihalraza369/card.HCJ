<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Water Effect Card</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #0f2027;
      background: linear-gradient(to right, #2c5364, #203a43, #0f2027);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .card {
      position: relative;
      width: 360px;
      height: 420px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      backdrop-filter: blur(20px);
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
      transition: 0.5s ease;
    }

    .card:hover {
      transform: scale(1.03);
      box-shadow: 0 0 40px #00ffff66;
    }

    .wave {
      position: absolute;
      width: 200%;
      height: 200%;
      top: -50%;
      left: -50%;
      background: url('https://svgshare.com/i/12Tq.svg');
      background-size: cover;
      animation: waveMove 6s infinite linear;
      opacity: 0.2;
    }

    @keyframes waveMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(100%); }
    }

    .content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 40px 30px;
      color: #fff;
    }

    .icon {
      font-size: 60px;
      margin-bottom: 20px;
      animation: float 2.5s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h2 {
      margin-bottom: 10px;
      color: #00ffff;
    }

    p {
      font-size: 14px;
      line-height: 1.5;
    }

    button {
      margin-top: 20px;
      padding: 10px 25px;
      background: #00ffff;
      color: #000;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #00dddd;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="wave"></div>
    <div class="content">
      <div class="icon">💧</div>
      <h2>Water Pulse</h2>
      <p>Feel the calm and energy of this animated water-inspired glass card. Refresh your senses.</p>
      <button onclick="alert('Splashed with style!')">Dive In</button>
    </div>
  </div>

</body>
</html>
