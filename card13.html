<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Holographic AI Card</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: radial-gradient(#000d1a, #000);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      overflow: hidden;
    }

    .matrix {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: repeating-linear-gradient(
        0deg,
        rgba(0, 255, 170, 0.05),
        rgba(0, 255, 170, 0.05) 1px,
        transparent 1px,
        transparent 20px
      );
      animation: scrollBg 10s linear infinite;
      z-index: -1;
    }

    @keyframes scrollBg {
      from { background-position: 0 0; }
      to { background-position: 0 1000px; }
    }

    .card {
      width: 360px;
      height: 460px;
      background: rgba(0, 255, 200, 0.1);
      border: 1px solid rgba(0, 255, 255, 0.3);
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.4);
      border-radius: 16px;
      backdrop-filter: blur(20px);
      padding: 30px;
      position: relative;
      transition: 0.4s ease;
      overflow: hidden;
    }

    .card:hover {
      box-shadow: 0 0 60px rgba(0, 255, 255, 0.6);
      border-color: #00f7ff;
    }

    .card::before {
      content: "";
      position: absolute;
      top: -100%;
      left: 0;
      width: 100%;
      height: 200%;
      background: linear-gradient(
        120deg,
        transparent,
        rgba(0, 255, 255, 0.2),
        transparent
      );
      animation: scan 3s linear infinite;
      pointer-events: none;
    }

    @keyframes scan {
      0% { top: -100%; }
      100% { top: 100%; }
    }

    .holo-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #00ffff;
      box-shadow: 0 0 20px #00ffff;
      margin: 0 auto 20px;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.6; }
    }

    .card h2 {
      text-align: center;
      color: #00ffff;
      margin-bottom: 10px;
      font-size: 22px;
      text-shadow: 0 0 10px #00ffff;
    }

    .card p {
      text-align: center;
      color: #d8ffff;
      font-size: 14px;
      line-height: 1.6;
    }

    .glitch-text {
      font-size: 14px;
      text-align: center;
      color: #00ffee;
      letter-spacing: 1px;
      margin-top: 25px;
      animation: glitch 2s infinite linear;
    }

    @keyframes glitch {
      0% { text-shadow: 2px 0 red, -2px 0 blue; }
      25% { text-shadow: -2px 0 green, 2px 0 cyan; }
      50% { text-shadow: 2px 0 magenta, -2px 0 lime; }
      75% { text-shadow: -2px 0 yellow, 2px 0 orange; }
      100% { text-shadow: 2px 0 red, -2px 0 blue; }
    }
  </style>
</head>
<body>

  <div class="matrix"></div>

  <div class="card">
    <div class="holo-circle"></div>
    <h2>AI Access Granted</h2>
    <p>
      Welcome to Nexus Protocol. Identity confirmed. Level 7 clearance granted.
    </p>
    <div class="glitch-text"># SYSTEM CORE // ACTIVE //</div>
  </div>

</body>
</html>
