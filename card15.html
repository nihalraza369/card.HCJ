<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Neon Cyberpunk Holo Card</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: radial-gradient(#001c2e, #0d0d0d);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Orbitron', sans-serif;
      overflow: hidden;
    }

    .card {
      width: 380px;
      height: 500px;
      background: rgba(0, 0, 20, 0.6);
      border-radius: 25px;
      position: relative;
      padding: 25px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 40px rgba(0, 255, 255, 0.6);
      color: #ffffff;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      box-shadow: 0 0 100px rgba(0, 255, 255, 1);
      transform: scale(1.05);
    }

    .neon-border {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, #00f7ff, #ff00d9, #00ff80);
      background-size: 400% 400%;
      animation: borderPulse 4s linear infinite;
      border-radius: 25px;
      z-index: -1;
    }

    @keyframes borderPulse {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .scan {
      position: absolute;
      top: -100%;
      left: 0;
      width: 100%;
      height: 200%;
      background: rgba(0, 255, 255, 0.2);
      animation: scanEffect 3s linear infinite;
      pointer-events: none;
    }

    @keyframes scanEffect {
      0% { top: -100%; }
      100% { top: 100%; }
    }

    h2 {
      text-align: center;
      font-size: 26px;
      color: #00ffef;
      text-shadow: 0 0 10px #00ffff, 0 0 20px #ff00d9;
      margin-top: 50px;
    }

    p {
      text-align: center;
      font-size: 16px;
      color: #bff;
      margin-top: 15px;
    }

    .glitch-text {
      font-size: 18px;
      text-align: center;
      margin-top: 30px;
      color: #ff00ff;
      text-shadow: 0 0 5px #ff00ff, 0 0 10px #00ff80, 0 0 15px #00ffff;
      animation: glitch 1.5s infinite linear;
    }

    @keyframes glitch {
      0% { text-shadow: 2px 0 red, -2px 0 blue; }
      25% { text-shadow: -2px 0 green, 2px 0 cyan; }
      50% { text-shadow: 2px 0 magenta, -2px 0 lime; }
      75% { text-shadow: -2px 0 yellow, 2px 0 orange; }
      100% { text-shadow: 2px 0 red, -2px 0 blue; }
    }

    .pulse {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(0, 255, 255, 0.2);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
      margin: 20px auto;
      animation: pulseGlow 2s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="neon-border"></div>
    <div class="scan"></div>
    <div class="pulse"></div>
    <h2>Neon Cyber Access</h2>
    <p>Authorization granted to Level 7.<br> Cybernetic Identity Confirmed.</p>
    <div class="glitch-text"># SYSTEM CHECK: ACTIVE //</div>
  </div>

  <script>
    const card = document.querySelector(".card");

    card.addEventListener("mousemove", (e) => {
      const { offsetX, offsetY } = e;
      const x = (offsetX / card.offsetWidth - 0.5) * 20;
      const y = (offsetY / card.offsetHeight - 0.5) * 20;
      card.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
    });

    card.addEventListener("mouseleave", () => {
      card.style.transform = `rotateY(0deg) rotateX(0deg)`;
    });
  </script>

</body>
</html>
